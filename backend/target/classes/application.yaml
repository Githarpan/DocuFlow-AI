
spring:
  application:
    name: docuflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/docuflow_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
